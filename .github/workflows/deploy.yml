name: Deploy to live URL via Cloudflare Tunnel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops-app:latest

      - name: Run container in background
        run: |
          docker run -d -p 5000:5000 --name devops-app ${{ secrets.DOCKER_USERNAME }}/devops-app:latest

      - name: Create public URL with Cloudflare Tunnel
        run: |
          # Download cloudflared
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          # Start the tunnel. This step will stay running and output the URL.
          ./cloudflared tunnel --url http://localhost:5000
      - name: Create public URL with Cloudflare Tunnel
        run: |
          # Run cloudflared in the background
          cloudflared tunnel --url http://localhost:8000 > /tmp/cloudflared.log 2>&1 &
          # Wait up to 10 seconds for the URL to appear in the logs
          echo "Waiting for tunnel to start..."
          while ! grep -q "https://" /tmp/cloudflared.log && [ $SECONDS -lt 10 ]; do sleep 1; done
          # Extract the URL
          URL=$(grep -oP 'https://.*\.trycloudflare.com' /tmp/cloudflared.log)

          # Print it so your later steps can use it (e.g., to run tests)
          echo "✅ Tunnel URL: $URL"
          echo "TUNNEL_URL=$URL" >> $GITHUB_ENV

          # Kill cloudflared so GitHub Actions considers this step 'finished'
          pkill cloudflared
